name: Wrong game data
description: The RadicalDex, SoulDex or Nuzlocke tools show a wrong location, evolution, level cap, stat or name.
title: "[Data] "
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      description: RadicalDex (Radical Red) or SoulDex (SoulGold)?
      options:
        - Radical Red 4.1
        - SoulGold
    validations:
      required: true
  - type: input
    id: pokemon
    attributes:
      label: Pokémon, item or move
      placeholder: "Eevee"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: What RadicalHex shows, and what the game or the official docs (Radical Red, or SoulGold's) say.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where can this be checked?
      placeholder: "Seen in game on Route 5 / dex.radicalred.net / eemeliri.github.io/soulgold"
