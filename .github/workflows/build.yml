name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks
        run: npm run check
      - name: Launch the app once (smoke test)
        run: npx electron . --smoke-test
      - name: Build the installer and portable .exe
        run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: RadicalHex-windows
          path: dist/*.exe
      - name: Read the version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Every push to main publishes (or refreshes) the release for package.json's version.
      - name: Publish the release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RadicalHex ${{ steps.version.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
